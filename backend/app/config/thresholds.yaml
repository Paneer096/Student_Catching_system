# Makerove Thresholds Configuration
# Every weight, threshold, and window used by the platform's algorithms.
# No magic numbers in code — everything reads from here.
# See MAKEROVE_SPEC.md §7 and Appendix B for documentation.

attendance:
  min_required_pct: 0.75            # Typical university requirement (75%)
  eligible_statuses: [PRESENT, LATE, ABSENT]
  excused_statuses: [MEDICAL_LEAVE, APPROVED_LEAVE, ON_DUTY]

group_absence:
  min_absentees: 3                  # Minimum absent students to consider a group event
  baseline_window_days: 28          # Rolling window for baseline computation
  z_threshold: 2.5                  # Standard deviations above baseline to flag
  baseline_sd_floor: 0.03           # Floor on baseline std dev to avoid division issues
  min_cohesion: 0.60                # Minimum community cohesion to flag as group
  class_wide_share: 0.70            # Above this, label as class-wide (info only)
  institutional_disruption:
    min_sections_affected_share: 0.5  # Share of sections exceeding uplift
    uplift_ratio: 2.0                 # Baseline multiplier to detect institution-wide events
  size_scale: 0.30                  # Denominator for size component normalization
  recurrence:
    high_window_days: 14            # Days to look back for high recurrence
    mid_window_days: 30             # Days to look back for mid recurrence
    jaccard_min: 0.5                # Minimum Jaccard overlap to consider recurrence
    high: 1.0                       # Recurrence score if event within high window
    mid: 0.5                        # Recurrence score if event within mid window
  score_weights:
    size: 0.35
    cohesion: 0.30
    recurrence: 0.20
    slot_importance: 0.15
  bands:
    high: 0.65                      # Score >= 0.65 → "High attention"
    watch: 0.40                     # Score 0.40–0.65 → "Watch"
                                    # Score < 0.40 → "Noted" (stored, not alerted)

coabsence:
  window_days: 90                   # Rolling window for co-absence computation
  min_shared_days: 4                # Minimum overlapping absence days for a pair
  min_lift: 2.0                     # Minimum lift ratio (observed / expected)
  fdr_q: 0.05                      # Benjamini-Hochberg FDR threshold

anchor:
  weights:
    pagerank: 0.5                   # Weighted PageRank on community subgraph
    betweenness: 0.3                # Betweenness centrality on section graph
    lead_lag: 0.2                   # Lead-lag normalized score
  min_episodes: 3                   # Minimum group episodes to flag as anchor
  high_confidence:
    episodes: 5                     # Episodes needed for high confidence
    significant_edges: 3            # Significant edges needed for high confidence
  unnoticed_connector_min_score: 0.6  # Min anchor_score with zero observations
  survey_edge_weights:
    mutual: 1.0                     # Weight for mutual survey nominations
    one_way: 0.4                    # Weight for one-way nominations

support_priority:
  weights:
    attendance_level: 0.30
    absence_trend: 0.25
    group_involvement: 0.15
    grade_drop: 0.15
    withdrawal: 0.10
    observations: 0.05
  attendance_ref_rate: 0.90         # 90% attendance → score 0
  attendance_span: 0.25             # 65% attendance → score 1
  trend_scale: 0.15                 # Normalization for absence trend
  group_events_cap: 4               # Cap on group event count for normalization
  grade_drop_scale_pct: 20          # Percentage points for full grade-drop score
  bands:
    reach_out: 0.65                 # "Reach out soon"
    watch: 0.40                     # "Keep an eye"
                                    # Below 0.40 → "On track"
  support_program_threshold_multiplier: 1.25  # Multiplier for support-program students

strengths:
  weights:
    grade: 0.30
    attendance: 0.25
    peer_support: 0.20
    clubs: 0.10
    observations: 0.15
  bands:
    emerging: 0.70                  # "Emerging strength"
    growing: 0.50                   # "Growing"
                                    # Below 0.50 → not shown

bridge_opportunity:
  min_strengths: 0.6                # Minimum strengths score
  min_support_priority: 0.4         # Minimum support priority score
  mentor_min_grade_strength: 0.7    # Mentor must have grade strength >= 0.7
  mentor_min_attendance: 0.90       # Mentor must have attendance >= 90%
  max_mentees_per_mentor: 2         # Cap on mentees per mentor

withdrawal:
  min_waves: 2                      # Minimum survey waves for wave-based detection
  drop_full_scale: 0.40             # Nomination drop fraction for full score
  proxy_min_signal: 0.8             # Minimum behavioural proxy signal
  proxy_min_factors: 2              # Minimum corroborating factors for proxy

calendar_risk:
  min_history_weeks: 6              # Minimum history to train ML model
  min_holiday_adjacent_samples: 8   # Minimum holiday-adjacent slots for training
  blend_full_weight_samples: 12     # Samples for full model weight in blend
  min_model_mae_improvement: 0.10   # Model must beat baseline by 10% MAE
  min_baseline: 0.03                # Floor for baseline in ratio calculations
  max_prediction: 0.95              # Cap on predicted absent share
  long_weekend_multiplier: 1.5      # Multiplier for long-weekend adjacent days
  heuristic_priors:                 # UNVALIDATED starting points; model replaces when data allow
    day_before_holiday: 0.80
    day_after_holiday: 0.60
    per_consecutive_nonworking_before: 0.20   # Capped at 3
    friday: 0.35
    monday: 0.25
    first_period: 0.15
    last_period: 0.35
    post_exam_days_1_to_3: 0.50
    low_criticality_subject: 0.15             # Criticality <= 2
  bands:
    yellow_ratio: 1.3               # Ratio >= 1.3 → Yellow
    orange_ratio: 2.0               # Ratio >= 2.0 → Orange
    red_ratio: 3.0                  # Ratio >= 3.0 → Red
    green_max_share: 0.20           # Green only if predicted < 0.20
    red_min_share: 0.35             # Red also if predicted >= 0.35

fairness:
  min_group_size: 10                # Suppress groups smaller than 10
  ratio_alert_low: 0.8              # Disparate impact ratio alert threshold
  ratio_alert_high: 1.25            # Upper bound
  p_value: 0.05                     # Chi-square significance level

retention:
  attendance_marks_years_after_exit: 2
  score_snapshot_days: 180
  audit_log_years: 3
  view_expiry_days: 30              # Classification views expire after 30 days

privacy:
  minor_peer_analysis: off          # Default: minors excluded from peer-edge inference
  idle_blur_minutes: 5              # Frontend blurs after 5 min idle
  session_idle_minutes: 30          # Session idle timeout
  session_absolute_hours: 12        # Session absolute timeout
