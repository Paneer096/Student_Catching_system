# Makarov — Thresholds Configuration
# Every threshold is a named setting with a code comment explaining why it has that value (§0).
# No magic numbers in code — everything reads from here.

# ─── Definitions (§2) ────────────────────────────────────────────────────────

attendance:
  min_attendance: 0.75               # §5.3: BELOW_MIN_ATTENDANCE threshold. Default 75%. Confirm your university's rule.
  eligible_statuses: [PRESENT, LATE, ABSENT]
  excused_statuses: [MEDICAL_LEAVE, ON_DUTY]
  include_full_day_absence: false    # §2: Full-day absence tracked separately. Set true to count as bunk.

mass_absence:
  mass_absence_threshold: 0.40       # §2: Session where ≥40% absent → excluded from pair analysis (fests, strikes, transport).

# ─── SKIPS_WITH Derivation (§5.1) ────────────────────────────────────────────

skips_with:
  min_co_bunks: 4                    # §5.1 step 4: Minimum co-bunk count to create edge. Default 4.
                                     # Why 4: two unrelated students each absent 15% of 100 days share ~2.25 absent days
                                     # on average, so ≥3 would pass for ~40% of random pairs.

  min_lift: 2.0                      # §5.1 step 4: Minimum lift ratio (observed/expected). Default 2.0.
                                     # lift = c / (a*b/N). Ensures co-bunking is at least 2x more than chance.

  fdr_alpha: 0.05                    # §5.1 step 3: Benjamini-Hochberg FDR threshold. Default 0.05.
                                     # Controls false discovery rate across all pair tests in the section.

  window_days: 90                    # Rolling window for co-absence computation (days to look back).

# ─── Bunk Groups (§5.2) ─────────────────────────────────────────────────────

groups:
  algorithm: "leiden"                # §5.2: Leiden (or Louvain with fixed seed). Leiden preferred for stability.
  louvain_seed: 42                   # Fixed seed for reproducibility
  min_group_size: 3                  # §5.2: Minimum group size. Pairs are shown as "pairs", not groups.

# ─── Patterns (§5.3) ─────────────────────────────────────────────────────────
# Rule-based flags. Thresholds live here. Each flag has a computed evidence string.
# There is NO composite "trouble score". The only numeric risk is prediction probability (§6).

patterns:
  below_min_attendance:
    threshold: 0.75                  # §5.3: Same as attendance.min_attendance.

  sudden_drop:
    recent_window_days: 14           # §5.3: Bunk rate over last 14 days.
    baseline_window_days: 60         # §5.3: vs prior 60 days.
    p_threshold: 0.05                # §5.3: Two-proportion z-test, p < 0.05.

  slot_concentration:
    min_bunks: 5                     # §5.3: Chi-square vs uniform, minimum 5 bunks.
    p_threshold: 0.05                # Chi-square significance level.

  long_absence:
    consecutive_days: 3              # §5.3: At least k consecutive full-day absences.
                                     # Route to welfare check-in, NOT discipline.

# ─── LEADS_SKIPS (§5.4) ─────────────────────────────────────────────────────

leads_skips:
  enabled: false                     # §5.4: EXPERIMENTAL, off by default.
  min_ordered_days: 8                # §5.4: Require at least 8 ordered co-bunk days.
  p_threshold: 0.05                  # §5.4: One-sided binomial test vs 0.5.

# ─── Prediction (§6) ─────────────────────────────────────────────────────────

prediction:
  cold_start_weeks: 4                # §6: Under 4 weeks of data → rule-based fallback "low confidence".
  retrain_interval_days: 7           # §6: Retrain weekly and log drift.
  probability_bands:                 # For the Today watchlist display
    high: 0.70                       # P(bunk) ≥ 0.70
    medium: 0.40                     # P(bunk) 0.40–0.70
    low: 0.15                        # P(bunk) 0.15–0.40
                                     # Below 0.15: not shown on watchlist

# ─── Privacy (§10) ───────────────────────────────────────────────────────────

privacy:
  session_idle_minutes: 30
  session_absolute_hours: 12
  idle_blur_minutes: 5               # Frontend blurs after 5 min idle
  minor_peer_analysis: off           # Default: minors excluded from peer-edge inference

retention:
  attendance_years_after_exit: 2
  audit_log_years: 3
